<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <!-- 极光（暗色）：夜里的天幕 + 几条发光的极光带。
       与亮色那张同一套构图（同一片天、同几条带子），只是换成夜里的光——
       一套皮肤的两张底图**该是同一个场景的两种时辰**，而不是两张不相干的图。 -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="52" />
    </filter>
    <linearGradient id="night" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#070d16" />
      <stop offset="0.55" stop-color="#0a1220" />
      <stop offset="1" stop-color="#0d1524" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#night)" />

  <g filter="url(#glow)">
    <path d="M -100 250 C 300 90, 700 300, 1150 120 C 1350 50, 1500 130, 1700 80 L 1700 -80 L -100 -80 Z" fill="#2ee6bd" opacity="0.42" />
    <path d="M -100 380 C 320 240, 760 430, 1180 260 C 1400 175, 1560 250, 1700 210 L 1700 60 L -100 130 Z" fill="#37c8f0" opacity="0.3" />
    <path d="M 200 520 C 560 400, 900 560, 1320 420 C 1500 360, 1620 410, 1720 380 L 1720 250 L 200 320 Z" fill="#7c5cff" opacity="0.34" />
    <!-- 地平线附近一层暖光：让下半部分不是纯黑，面板透出来时才有东西可看 -->
    <ellipse cx="900" cy="880" rx="1100" ry="180" fill="#1b3a4a" opacity="0.5" />
  </g>

  <!-- 星点：**很少**——多了就成了噪点，而背景的职责是安静 -->
  <g fill="#dff5f0">
    <circle cx="220" cy="140" r="1.6" opacity="0.5" />
    <circle cx="520" cy="90" r="1.2" opacity="0.35" />
    <circle cx="880" cy="180" r="1.8" opacity="0.45" />
    <circle cx="1240" cy="110" r="1.3" opacity="0.3" />
    <circle cx="1460" cy="230" r="1.5" opacity="0.4" />
    <circle cx="360" cy="330" r="1.1" opacity="0.25" />
    <circle cx="1060" cy="300" r="1.4" opacity="0.3" />
  </g>
</svg>
