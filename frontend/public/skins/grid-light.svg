<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 格纸（亮）：没格纸的工程感，靠的是"大格 200 / 小格 40"的节奏。
       两条实现上的讲究：
       1. 线画在 x.5 上、宽 1——这样正好落在像素上，不会糊成两像素的灰边。
       2. **大格线画在格子的左/上边缘**（0.5），右/下边缘不画。画两边的话平铺之后
          相邻两格各出一半，接缝处会变成双倍粗的一条。 -->
  <g stroke="#243546" stroke-width="1" fill="none">
    <path d="M40.5 0 V200 M80.5 0 V200 M120.5 0 V200 M160.5 0 V200" stroke-opacity="0.05"/>
    <path d="M0 40.5 H200 M0 80.5 H200 M0 120.5 H200 M0 160.5 H200" stroke-opacity="0.05"/>
    <path d="M0.5 0 V200 M0 0.5 H200" stroke-opacity="0.085"/>
  </g>
</svg>
