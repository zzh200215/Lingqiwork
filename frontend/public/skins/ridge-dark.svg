<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- 远山（暗）：与亮色同一套构图，方向反过来——暗底上山脊要比天色**亮**才看得见，
       而"越近越接近天色"这条仍然成立，所以越往下越暗、越平。 -->
  <defs>
    <linearGradient id="sky-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1117"/>
      <stop offset="0.62" stop-color="#0b0f15"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="mist-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a22" stop-opacity="0"/>
      <stop offset="1" stop-color="#121a22" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky-dark)"/>

  <path d="M0 452 L188 396 L322 430 L470 350 L610 404 L760 336 L902 392 L1058 344 L1214 402 L1372 356 L1600 420 L1600 900 L0 900 Z"
        fill="#18222d"/>
  <rect x="0" y="404" width="1600" height="120" fill="url(#mist-dark)"/>

  <path d="M0 548 L142 494 L286 540 L438 470 L596 528 L742 466 L890 522 L1044 474 L1206 536 L1358 486 L1600 552 L1600 900 L0 900 Z"
        fill="#151d26"/>
  <rect x="0" y="516" width="1600" height="104" fill="url(#mist-dark)"/>

  <path d="M0 648 L168 604 L330 646 L488 592 L648 640 L812 588 L978 638 L1140 596 L1310 644 L1462 608 L1600 650 L1600 900 L0 900 Z"
        fill="#111820"/>
  <rect x="0" y="628" width="1600" height="86" fill="url(#mist-dark)"/>

  <path d="M0 752 L176 718 L344 752 L512 712 L680 750 L852 714 L1024 752 L1196 716 L1368 754 L1520 724 L1600 748 L1600 900 L0 900 Z"
        fill="#0e141a"/>
</svg>
