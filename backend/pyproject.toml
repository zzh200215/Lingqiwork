[project]
name = "workbench"
version = "0.1.0"
description = "AI personal workbench - local-first"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.60.0",
    "anthropic>=0.42.0",
    "chromadb>=1.0.0",
    "langchain-text-splitters>=0.3.11",
    "sentence-transformers>=3.4.1",
    "pymupdf>=1.24.0",
    "docx2txt>=0.8",
    "watchfiles>=1.0.0",
    "python-multipart>=0.0.9",
    "mcp>=1.5.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "apscheduler>=3.11.3",
    "rapidocr-onnxruntime>=1.4.4",
    "pywebview>=6.2.1",
    "pystray>=0.19.5",
    "keyboard>=0.13.5",
    "pyperclip>=1.11.0",
    "feedparser>=6.0.14",
    "winotify>=1.1.0",
    "faster-whisper>=1.1.0",
    "edge-tts>=7.2.8",
    "neo4j>=6.3.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
